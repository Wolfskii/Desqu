version: "3"

# Repo-wide entry point. Each app keeps its own Taskfile.yml; run `task --list` for all tasks.

includes:
  desqu:
    taskfile: ./apps/desqu/Taskfile.yml
    dir: ./apps/desqu
  vials:
    taskfile: ./apps/vials/Taskfile.yml
    dir: ./apps/vials
  workspaces:
    taskfile: ./apps/workspaces/Taskfile.yml
    dir: ./apps/workspaces
  screenbound:
    taskfile: ./apps/screenbound/Taskfile.yml
    dir: ./apps/screenbound
  browser:
    taskfile: ./apps/browser-extension/Taskfile.yml
    dir: ./apps/browser-extension

tasks:
  default:
    desc: List tasks
    silent: true
    cmds:
      - task --list

  install:
    desc: Install npm dependencies (all workspaces)
    cmds:
      - npm install

  crates:
    desc: Unit tests and clippy for the shared crates (desqu-shell, desqu-desktop, desqu-ipc)
    cmds:
      - cargo test -p desqu-shell -p desqu-desktop -p desqu-ipc
      - cargo clippy -p desqu-shell -p desqu-desktop -p desqu-ipc --all-targets -- -D warnings

  probe:
    desc: Real-desktop tests (touch only temporary files and windows they create themselves)
    cmds:
      - cargo test -p desqu-desktop --test real_desktop -- --ignored --nocapture
      - task: screenbound:probe

  ci:
    desc: CI for every app and shared crate
    cmds:
      - task: crates
      - task: screenbound:ci
      - task: desqu:ci
      - task: vials:ci
      - task: workspaces:ci
      - task: browser:ci
