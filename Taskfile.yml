version: "3"

# Repo-wide entry point. The apps are the GPUI ones (see Taskfile.gpui.yml): `task dev` runs Desqu,
# `task gpui:<name>` runs one app on its own. `task --list` shows everything.

includes:
  gpui:
    taskfile: ./Taskfile.gpui.yml
    dir: .
  browser:
    taskfile: ./apps/browser-extension/Taskfile.yml
    dir: ./apps/browser-extension

tasks:
  default:
    desc: List tasks
    silent: true
    cmds:
      - task --list

  dev:
    desc: Run Desqu (GPUI) with its apps, no install (same as gpui:desqu)
    interactive: true
    cmds:
      - task: gpui:desqu

  install:
    desc: Install npm dependencies (the browser extension)
    cmds:
      - npm install

  test:
    desc: Unit tests for every app and shared crate (same as gpui:test)
    cmds:
      - task: gpui:test

  crates:
    desc: Unit tests and clippy for the shared crates (desqu-shell, desqu-desktop, desqu-ipc)
    cmds:
      - cargo test -p desqu-shell -p desqu-desktop -p desqu-ipc
      - cargo clippy -p desqu-shell -p desqu-desktop -p desqu-ipc --all-targets -- -D warnings

  probe:
    desc: Real-desktop tests (touch only temporary files and windows they create themselves)
    cmds:
      - cargo test -p desqu-desktop --test real_desktop -- --ignored --nocapture
      - cargo test -p screenbound-module -- --ignored --nocapture

  ci:
    desc: CI for every app and shared crate
    cmds:
      - task: crates
      - task: gpui:ci
      - task: browser:ci
