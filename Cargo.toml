[workspace]
resolver = "2"
members = [
    "apps/desqu/src-tauri",
    "apps/screenbound/module",
    "apps/screenbound/src-tauri",
    "apps/vials/module",
    "crates/desqu-desktop",
    "crates/desqu-shell",
]

# Profiles are only honoured at the workspace root.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# Unwinding (not abort) so shutdown/restore paths still run if a panic escapes a thread.
panic = "unwind"
strip = true
