name: Release the Desqu family

# One version for every product (see docs/releasing.md). Each product's release is a job in this one run,
# so the whole family is released from a single action. The product jobs run one after another (the
# update-feed push needs that); the browser add-on runs alongside them.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Shared version without the leading v (must match the repository)
        required: true
        type: string

permissions:
  contents: write

jobs:
  desqu:
    uses: ./.github/workflows/release.yml
    with:
      app: desqu
      version: ${{ inputs.version }}
    secrets: inherit

  screenbound:
    needs: desqu
    uses: ./.github/workflows/release.yml
    with:
      app: screenbound
      version: ${{ inputs.version }}
    secrets: inherit

  vials:
    needs: screenbound
    uses: ./.github/workflows/release.yml
    with:
      app: vials
      version: ${{ inputs.version }}
    secrets: inherit

  workspaces:
    needs: vials
    uses: ./.github/workflows/release.yml
    with:
      app: workspaces
      version: ${{ inputs.version }}
    secrets: inherit

  browser:
    uses: ./.github/workflows/browser-extension.yml
    with:
      version: ${{ inputs.version }}
