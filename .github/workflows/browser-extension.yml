name: Browser extension release

# Tag `browser-v<version>` (e.g. browser-v0.1.0) to attach the extension zips to a GitHub release.
# Store uploads are separate: see apps/browser-extension/docs/publishing.md.
# These zips install only in developer mode (Chromium) or once signed by Mozilla (Firefox).
on:
  push:
    tags:
      - 'browser-v*'
  workflow_dispatch:
    inputs:
      version:
        description: Version without the leading v (must match apps/browser-extension/package.json)
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version and tag
        id: meta
        shell: pwsh
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if ($env:EVENT -eq 'workflow_dispatch') {
            $tag = "browser-v$($env:INPUT_VERSION)"
          } else {
            $tag = $env:REF_NAME
          }
          if ($tag -notmatch '^browser-v(\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?)$') {
            throw "Tag '$tag' is not browser-v<semver>"
          }
          $version = $Matches[1]
          $pkg = Get-Content -Raw 'apps/browser-extension/package.json' | ConvertFrom-Json
          if ($pkg.version -ne $version) {
            throw "apps/browser-extension/package.json says $($pkg.version), the tag says $version"
          }
          @("tag=$tag", "version=$version") | Add-Content $env:GITHUB_OUTPUT

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - run: npm ci

      - name: Type check, tests and all builds
        run: task browser:ci

      - name: Package the store zips
        run: task browser:zip

      - name: Create GitHub release with the zips
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          $files = Get-ChildItem 'apps/browser-extension/.output' -Filter 'desqu-fullscreen-*.zip' | ForEach-Object { $_.FullName }
          if (-not $files) { throw 'No zips were produced' }
          gh release create $env:TAG @files --title "Desqu Fullscreen $($env:VERSION)" --generate-notes --target $env:GITHUB_SHA --latest=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
