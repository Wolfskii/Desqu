name: Release

# One release for the whole family. Tag `v<version>` (e.g. v0.4.0), or run this workflow by hand with the
# version (the repository must already be at it). Desqu, Screenbound, Vials, Workspaces and the browser
# add-on build in parallel. The release and the update feeds are published once, after every build passed.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Shared version without the leading v (must match the repository)
        required: true
        type: string

permissions:
  contents: write

jobs:
  check:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the version and tag
        id: meta
        shell: pwsh
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if ($env:EVENT -eq 'workflow_dispatch') {
            $tag = "v$($env:INPUT_VERSION)"
          } else {
            $tag = $env:REF_NAME
          }
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)$') {
            throw "Tag '$tag' is not v<semver>. Prerelease builds are not published by this workflow."
          }
          @("tag=$tag", "version=$($Matches[1])") | Add-Content $env:GITHUB_OUTPUT

      - name: Check every product has that version
        shell: pwsh
        run: ./scripts/check-versions.ps1 -Tag '${{ steps.meta.outputs.tag }}'

  apps:
    needs: check
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: desqu
            key: DESQU
          - app: screenbound
            key: SCREENBOUND
          - app: vials
            key: VIALS
          - app: workspaces
            key: WORKSPACES
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - run: npm ci

      # The product's updater key is a repository secret (DESQU_/SCREENBOUND_/VIALS_/WORKSPACES_
      # UPDATER_KEY, optional *_UPDATER_KEY_PASSWORD). Without it the build fails on purpose.
      - name: Build, sign and collect the installers
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets[format('{0}_UPDATER_KEY', matrix.key)] }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets[format('{0}_UPDATER_KEY_PASSWORD', matrix.key)] }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw "Secret ${{ matrix.key }}_UPDATER_KEY is not set" }
          task ${{ matrix.app }}:release:signed

      - name: Write the update feed
        shell: pwsh
        run: ./scripts/write-update-feed.ps1 -App '${{ matrix.app }}' -Tag '${{ needs.check.outputs.tag }}'

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.app }}
          path: dist/${{ matrix.app }}
          if-no-files-found: error

  browser:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - run: npm ci

      - name: Type check, tests and all builds
        run: task browser:ci

      - name: Package the store zips
        run: task browser:zip

      - uses: actions/upload-artifact@v4
        with:
          name: dist-browser
          path: apps/browser-extension/.output/desqu-fullscreen-*.zip
          if-no-files-found: error

  publish:
    needs: [check, apps, browser]
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: artifacts

      - name: Create the release with every installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.check.outputs.tag }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          $notes = @()
          $files = @()
          foreach ($dir in Get-ChildItem artifacts -Directory) {
            $product = $dir.Name -replace '^dist-', ''
            foreach ($f in Get-ChildItem $dir.FullName -File -Recurse) {
              if ($f.Name -eq 'RELEASE_NOTES.md') {
                $notes += "## $product"
                $notes += (Get-Content -Raw $f.FullName).Trim()
                $notes += ''
              } elseif ($f.Name -eq 'SHA256SUMS.txt' -or $f.Name -eq 'latest.json') {
                # Per-product checksums are replaced by one combined file below. Feeds are published separately.
              } else {
                $files += $f.FullName
              }
            }
          }
          if ($notes.Count -eq 0) { $notes = @("Desqu family $env:VERSION") }
          $notesFile = Join-Path $PWD 'RELEASE_NOTES.md'
          [System.IO.File]::WriteAllText($notesFile, ($notes -join "`n"), (New-Object System.Text.UTF8Encoding($false)))

          $sums = $files | Sort-Object { Split-Path $_ -Leaf } | ForEach-Object {
            "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $(Split-Path $_ -Leaf)"
          }
          $sumsFile = Join-Path $PWD 'SHA256SUMS.txt'
          [System.IO.File]::WriteAllText($sumsFile, (($sums -join "`n") + "`n"), (New-Object System.Text.UTF8Encoding($false)))
          $files += $sumsFile

          gh release create $env:TAG @files --title "Desqu $env:VERSION" --notes-file $notesFile --target $env:GITHUB_SHA --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage the update feeds
        shell: pwsh
        run: |
          $stage = Join-Path $PWD 'feeds'
          foreach ($dir in Get-ChildItem artifacts -Directory | Where-Object { $_.Name -ne 'dist-browser' }) {
            $app = $dir.Name -replace '^dist-', ''
            $feed = Join-Path $dir.FullName 'feed/latest.json'
            if (-not (Test-Path $feed)) { throw "No update feed for $app" }
            $target = Join-Path $stage "updates/$app"
            New-Item -ItemType Directory -Force -Path $target | Out-Null
            Copy-Item -Force $feed (Join-Path $target 'latest.json')
          }

      # The feeds go out only after every product built and the release exists.
      - name: Publish the update feeds
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: feeds
          keep_files: true
