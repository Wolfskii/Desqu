[package]
name = "desqu-desktop"
version = "0.1.0"
description = "Shared desktop-icon layer for Vials and Workspaces: enumerate, position and hide desktop items"
authors = ["Desqu contributors"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "desqu_desktop"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"
thiserror = "2"
tracing = "0.1"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]
