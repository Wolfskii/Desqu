[package]
name = "vials-core"
version = "0.3.0"
description = "Vials' pure logic (model, rules, layout, sorting). No native calls, no UI framework."
authors = ["Desqu contributors"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "vials_core"

[dependencies]
desqu-desktop = { path = "../desqu-desktop" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
