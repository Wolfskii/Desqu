[package]
name = "desqu-ipc"
version = "0.1.0"
description = "Length-prefixed frames for Desqu's browser bridge (stdio and named pipe). No Tauri, no UI."
authors = ["ScreenBound contributors"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "desqu_ipc"

[dependencies]

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
]
