version: "3"

# Screenbound. Run from here (`task ci`) or from the repo root as `task screenbound:<task>`.
# Dependencies are installed once at the repo root (npm workspace).

tasks:
  default:
    desc: List tasks
    silent: true
    cmds:
      - task --list

  install:
    desc: Install npm dependencies (repo root workspace)
    dir: ../..
    sources:
      - package.json
      - package-lock.json
    generates:
      - node_modules/.package-lock.json
    cmds:
      - npm install

  dev:
    desc: Run Screenbound locally (Vite + Tauri)
    deps: [install]
    interactive: true
    cmds:
      - npm run tauri dev

  dev:logs:
    desc: Run Screenbound locally with engine debug logs
    deps: [install]
    interactive: true
    env:
      RUST_LOG: screenbound_lib=debug,screenbound_module=debug
    cmds:
      - npm run tauri dev

  check:
    desc: Frontend type check
    deps: [install]
    cmds:
      - npm run check

  test:
    desc: Rust unit tests
    cmds:
      - cargo test -p screenbound-module -p screenbound

  probe:
    desc: Read-only probe of real monitors and windows
    cmds:
      - cargo test -p screenbound-module -- --ignored --nocapture

  probe:resize:
    desc: Resize one window and print how its bounds change (PID=)
    requires:
      vars: [PID]
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/probe-resize.ps1 -ProcessId {{.PID}}{{if .NOSEND}} -NoSendChanging{{end}}

  lint:
    desc: Clippy on all Rust targets
    cmds:
      - cargo clippy -p screenbound-module -p screenbound --all-targets

  ci:
    desc: Typecheck, unit tests, and clippy
    cmds:
      - task: check
      - task: test
      - task: lint

  release:
    aliases: [build]
    desc: Local production build — NSIS + MSI installers and a portable exe in dist/screenbound/ (unsigned, no password prompt)
    deps: [install]
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File ../../scripts/stop-app.ps1 -Names screenbound,ScreenBound,Screenbound
      - powershell -NoProfile -ExecutionPolicy Bypass -File ../../scripts/tauri-build.ps1 -App screenbound -NoSign
      - powershell -NoProfile -ExecutionPolicy Bypass -File ../../scripts/publish-artifacts.ps1 -App screenbound

  release:signed:
    desc: Like release, but signs the updater artifacts with ~/.tauri/screenbound.key (asks for the key password; empty = press Enter)
    deps: [install]
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File ../../scripts/tauri-build.ps1 -App screenbound
      - powershell -NoProfile -ExecutionPolicy Bypass -File ../../scripts/publish-artifacts.ps1 -App screenbound

  deploy:
    desc: Build release artifacts and install the NSIS setup for the current user
    cmds:
      - task: release
      - powershell -NoProfile -ExecutionPolicy Bypass -File ../../scripts/install-local.ps1 -App screenbound
