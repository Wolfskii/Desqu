[package]
name = "desqu-browser-host"
version = "0.1.0"
description = "Native messaging host: relays the Desqu Fullscreen extension to Desqu or Screenbound over a named pipe"
authors = ["ScreenBound contributors"]
edition = "2021"
rust-version = "1.80"

# Started by the browser (native messaging). Depends only on the framing crate and Windows APIs:
# no Tauri, no module code (see scripts/check-standalone-deps.ps1).
[[bin]]
name = "desqu-browser-host"
path = "src/main.rs"

[dependencies]
desqu-ipc = { path = "../../../crates/desqu-ipc" }
serde_json = "1"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
]
