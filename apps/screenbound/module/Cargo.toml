[package]
name = "screenbound-module"
version = "0.3.0"
description = "Screenbound engine: constrain fullscreen windows to user-defined screen zones"
authors = ["ScreenBound contributors"]
edition = "2021"
rust-version = "1.80"
# Required by tauri-plugin: must equal the package name, which is also the plugin name.
links = "screenbound-module"

[lib]
name = "screenbound_module"

[features]
# The Tauri plugin around the engine. The GPUI app uses the engine without it.
default = ["tauri-plugin"]
tauri-plugin = ["dep:tauri", "dep:desqu-shell", "dep:tauri-plugin"]

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"], optional = true }

[dependencies]
desqu-shell = { path = "../../../crates/desqu-shell", optional = true }
desqu-ipc = { path = "../../../crates/desqu-ipc" }
tauri = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Devices_Display",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_LibraryLoader",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]
