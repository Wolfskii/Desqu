[package]
name = "screenbound"
version = "0.1.0"
description = "Native window behavior manager: constrain fullscreen to user-defined screen zones"
authors = ["ScreenBound contributors"]
edition = "2021"
rust-version = "1.80"

[lib]
# The `_lib` suffix avoids a bin/lib name clash on Windows (cargo#8519).
name = "screenbound_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
screenbound-module = { path = "../module" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
