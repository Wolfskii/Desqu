[package]
name = "screenbound-gpui"
version = "0.4.0"
description = "Screenbound with GPUI instead of Tauri + WebView2"
edition = "2021"
publish = false

# Standalone workspace: the Tauri apps and their CI are not affected by GPUI's dependency tree.
[workspace]

[build-dependencies]
winresource = "0.1"

[dependencies]
gpui = "0.2.2"
desqu-native-shell = { path = "../../crates/desqu-native-shell" }
screenbound-module = { path = "../screenbound/module", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
