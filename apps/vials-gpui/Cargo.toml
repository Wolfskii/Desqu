[package]
name = "vials-gpui"
version = "0.9.0"
description = "Vials with GPUI instead of Tauri + WebView2"
edition = "2021"
publish = false

# Standalone workspace: the Tauri apps and their CI are not affected by GPUI's dependency tree.
[workspace]

[build-dependencies]
winresource = "0.1"

[dependencies]
gpui = "0.2.2"
raw-window-handle = "0.6"
desqu-native-shell = { path = "../../crates/desqu-native-shell" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp"] }
vials-core = { path = "../../crates/vials-core" }
desqu-desktop = { path = "../../crates/desqu-desktop" }
vials-platform = { path = "../../crates/vials-platform" }
workspaces-core = { path = "../../crates/workspaces-core" }
workspaces-platform = { path = "../../crates/workspaces-platform" }

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
gpui = { version = "0.2.2", features = ["test-support"] }
