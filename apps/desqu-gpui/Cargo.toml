[package]
name = "desqu-gpui"
version = "1.0.0"
description = "Desqu with GPUI: one tray icon and one window for Vials, Workspaces and Screenbound"
edition = "2021"
publish = false

# Standalone workspace: the Tauri apps and their CI are not affected by GPUI's dependency tree.
[workspace]

[build-dependencies]
winresource = "0.1"

[dependencies]
gpui = "0.2.2"
desqu-native-shell = { path = "../../crates/desqu-native-shell" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
