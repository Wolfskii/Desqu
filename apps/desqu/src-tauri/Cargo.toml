[package]
name = "desqu"
version = "0.1.0"
description = "Desqu: a collection of desktop utilities in one app"
authors = ["Desqu contributors"]
edition = "2021"
rust-version = "1.80"

[lib]
# The `_lib` suffix avoids a bin/lib name clash on Windows (cargo#8519).
name = "desqu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
desqu-shell = { path = "../../../crates/desqu-shell" }
screenbound-module = { path = "../../screenbound/module" }
vials-module = { path = "../../vials/module" }
workspaces-module = { path = "../../workspaces/module" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
